name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Invariant self-test
        run: npm run selftest

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_POLL_MS: '4000'

  publish-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo is published, so check the files that actually ship. Both rules
      # below caught real leaks during development: a private provider name and key
      # variable, and absolute paths from the machine it was written on.
      #
      # The patterns are assembled from fragments at runtime so this workflow does
      # not match itself — it is a tracked .yml file, and a literal pattern here
      # would report the scanner as a leak.
      - name: Published files carry no private identifiers or host paths
        run: |
          set -e
          # notes-backend.md documents the private identifiers it removed, so it is
          # the one file exempt from the identifier scan.
          files=$(git ls-files '*.ts' '*.tsx' '*.md' '*.json' '*.example' '*.yml' '*.mjs' \
                  ':!:docs/notes-backend.md')
          fail=0

          ids="hol""la|natural""ine|radius""ku|drac""in|pcbuild""it"
          if echo "$files" | xargs grep -InE "$ids" ; then
            echo "::error::private identifier found in a published file"
            fail=1
          fi

          # Authoring-machine paths, not container-internal ones: /root/.hermes is a
          # legitimate docker volume mount and must not trip this.
          paths="/root/(hermes-virtual-office|infra|panel)|/home/[a-z]+/infra"
          if echo "$files" | xargs grep -InE "$paths" ; then
            echo "::error::authoring-machine path found in a published file"
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "clean"
          exit $fail
