name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Invariant self-test
        run: npm run selftest

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_POLL_MS: '4000'

  publish-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo is published, so check the files that actually ship. All three
      # rules below caught real leaks during development: a private provider name
      # and key variable, absolute paths from the machine it was written on, and
      # the operator's real public WAN address used as an example/fixture.
      #
      # The patterns are assembled from fragments at runtime so this workflow does
      # not match itself — it is a tracked .yml file, and a literal pattern here
      # would report the scanner as a leak.
      - name: Published files carry no private identifiers or host paths
        run: |
          set -e
          # notes-backend.md documents the private identifiers it removed, so it is
          # the one file exempt from the identifier scan.
          files=$(git ls-files '*.ts' '*.tsx' '*.md' '*.json' '*.example' '*.yml' '*.mjs' \
                  ':!:docs/notes-backend.md')
          fail=0

          # CONSCIOUS DECISION (README-LINKS-1): the operator's own product
          # domains (holla/pay gateway, radiusku, dracin, pcbuildit) are
          # deliberately published in README "Made by" for attribution — they
          # are NOT leaks. This rule now only guards what stays private: the
          # LLM provider name (natural+ine). Authoring-machine paths and public
          # IPs below are unchanged and still enforced.
          ids="natural""ine"
          if echo "$files" | xargs grep -InE "$ids" ; then
            echo "::error::private identifier found in a published file"
            fail=1
          fi

          # Authoring-machine paths, not container-internal ones: /root/.hermes is a
          # legitimate docker volume mount and must not trip this.
          paths="/root/(hermes-virtual-office|infra|panel)|/home/[a-z]+/infra"
          if echo "$files" | xargs grep -InE "$paths" ; then
            echo "::error::authoring-machine path found in a published file"
            fail=1
          fi

          # A real public WAN address once shipped here as an example/fixture, and
          # the two rules above could not see it. Any non-documentation public
          # IPv4 in a published file fails the build: loopback, RFC 1918
          # private ranges, and RFC 5737 documentation blocks are allowed, and
          # so is the exempt file above. The quad pattern is assembled from
          # fragments for the same self-match reason.
          oct="[0-9]{1,3}"
          dot="\."
          quad="$oct$dot$oct$dot$oct$dot$oct"
          pub_ips=$(echo "$files" | xargs grep -hoE "$quad" 2>/dev/null | sort -u)
          bad_ips=""
          for ip in $pub_ips; do
            case "$ip" in
              127.*|10.*|192.168.*|192.0.2.*|198.51.100.*|203.0.113.*) continue ;;
              172.1[6-9].*|172.2[0-9].*|172.3[01].*) continue ;;
              *) bad_ips="$bad_ips $ip" ;;
            esac
          done
          if [ -n "$bad_ips" ]; then
            for ip in $bad_ips; do
              echo "$files" | xargs grep -InE "$ip"
            done
            echo "::error::public IPv4 address found in a published file (use an RFC 5737 documentation address instead)"
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "clean"
          exit $fail
